name: Publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, but let a queued render finish rather than
# cancelling it: a half-published Pages site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      # `pak` resolves from RSPM binaries; without this every package builds
      # from source and the job takes half an hour.
      RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # ripr is not on CRAN, and two of its dependencies need pinning:
          #
          #   S7      — 0.2.1 does not build on R >= 4.6: its init.c reads
          #             `R_NamespaceRegistry`, which R no longer declares.
          #             0.2.2 dropped it and works with current ripr, so this
          #             is a floor rather than an exact pin.
          #   rlang   — ripr calls `rlang::check_number_whole()` and friends,
          #             which no released rlang exports. Drop this line once
          #             they are exported upstream or vendored into ripr.
          packages: |
            any::jsonlite
            RConsortium/S7@v0.2.2
            r-lib/rlang
            fleverest/ripr
          cache-version: 3

      # The fits and the certifications are the slow part, and knitr keys its
      # cache on chunk contents, so restoring across commits is safe: touching
      # a chunk invalidates exactly that chunk and its dependents.
      - name: Restore knitr cache
        uses: actions/cache@v4
        with:
          path: search-slides_cache
          key: knitr-${{ runner.os }}-${{ hashFiles('search-slides.qmd') }}
          restore-keys: knitr-${{ runner.os }}-

      - name: Render
        run: quarto render search-slides.qmd

      # `embed-resources: true` makes the deck a single file with d3 and the
      # run data inlined, so the site is one page and there is no _files
      # directory to carry along.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp search-slides.html _site/index.html
          test -s _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
